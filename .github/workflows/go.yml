name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repository is a Go workspace. `./...` only matches packages of the root
# module, so every step below resolves the module list from go.work first.
# Without it, provider/eventemitter, provider/opentelemetry, provider/slogzerolog
# and demo are never built, tested or linted.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: "1.x"
          check-latest: true
        id: go

      - name: Resolve workspace modules
        id: modules
        run: echo "list=$(go list -f '{{.Dir}}/...' -m | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build -race -v ${{ steps.modules.outputs.list }}

      - name: Test
        run: go test -race -count=1 ${{ steps.modules.outputs.list }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run golangci-lint
        run: golangci-lint run --timeout=300s ${{ steps.modules.outputs.list }}
